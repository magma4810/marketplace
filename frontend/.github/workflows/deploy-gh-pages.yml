name: Deploy to GithubPages

on:
  pull_request:
    branches:
      - main 

permissions:
  contents: write

jobs:
  deploy-to-gh-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Install Packages
        working-directory: frontend  
        run: npm install

      - name: Build
        working-directory: frontend  
        run: npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages  
          folder: frontend/dist