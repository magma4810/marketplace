name: PR Sanity Check

on: pull_request

jobs:
  lint:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Packages
        working-directory: frontend
        run: |
          npm install

      - name: Lint check
        working-directory: frontend
        run: |
          npm run lint

      - name: test
        working-directory: frontend
        run: |
          npm run test